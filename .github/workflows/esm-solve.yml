# Installing the locked `esm` environment.
#
# A lock that no longer answers `pyproject.toml` already fails the pull-request jobs, `esm`
# included: `locked: true` reads the whole workspace and not the one environment being
# installed. What no job there does is install `esm` — the model tests sit behind `-m model`
# and no runner has a GPU — so nothing checks that the locked packages still download and
# still install: a PyPI-only `esm`, torch from conda-forge rather than PyPI, the CUDA runtime
# headers that Triton's kernel build needs, and the activation that points at them. This
# workflow installs that environment and stops, which is exactly the half a GPU is not
# needed for.
#
# Its own trigger, never the pull request: an expensive check that fails for reasons a
# branch did not cause must not be able to turn a pull request red.
name: esm-solve

on:
  schedule:
    # Weekly. The breakage this catches arrives with an upstream release, not with a commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: esm
          # Install the locked set rather than solve a new one, so a green run is about
          # these artifacts and not about whatever resolves that day.
          locked: true
