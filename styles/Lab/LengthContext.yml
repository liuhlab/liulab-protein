# Word cap for CONTEXT.md, the glossary. Looser than Lab.LengthDoc's 1000 because a glossary
# is measured per entry and not per file: `conformance` caps an entry at 200 words, which is
# the unit that matches how the file grows. This cap is the backstop on the whole file.
#
# This is a dial, not a law. Raising it is a one-line diff here, made deliberately, with the
# reason in the commit message. A glossary that will not fit is usually a glossary carrying
# an explanation that belongs in docs/ or in an ADR.
#
# `metric` rules are summary-scoped: the variables are computed over the whole file and the
# alert is reported at 1:1. The condition must be floating point — "> 2000.0" and not
# "> 2000", which vale does not parse.
extends: metric
message: "This file is %s words; the cap is 2000. Cut it or move an entry out."
level: error
formula: words
condition: "> 2000.0"
