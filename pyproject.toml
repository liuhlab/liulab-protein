# ============================== project ==============================

[project]
name = "liulab-protein"
description = "Handling protein sequence related tasks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Liu Lab" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# hatch-vcs reads the newest git tag. Never add a `version` key.
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
    "numpy>=2",
    # <3 is liulab-genome's cap; a wider range breaks the pypi solve.
    "pandas>=2.1,<3",
    "pyarrow>=17",
    "biotite>=1",
]

[project.scripts]
protein = "protein.cli:app"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# No `fallback-version`: that is a hand-written version string.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/protein"]

# ============================== pixi ==============================

[tool.pixi.workspace]
# bioconda second, so conda-forge still wins every tie. It carries mmseqs2 and foldseek.
channels = ["conda-forge", "bioconda"]
# linux-64 only: this is a cluster package. The cuda variant is what `esm` resolves against.
platforms = [{ platform = "linux-64", cuda = "12" }, "linux-64"]

[tool.pixi.pypi-dependencies]
liulab-protein = { path = ".", editable = true }
# Not in `[project] dependencies`: PyPI rejects metadata carrying a git+https reference.
liulab-genome = { git = "https://github.com/liuhlab/liulab-genome.git" }

# `requires-python` is the floor, and conformance holds every other declared Python version to
# it. Runtime dependencies are mirrored from `[project]` so pixi takes them from conda-forge.
[tool.pixi.dependencies]
python = "3.13.*"
typer = ">=0.12"
numpy = ">=2"
pandas = ">=2.1,<3"
pyarrow = ">=17"
biotite = ">=1"
# liulab-genome declares these conda-side only, so pip cannot supply them, and without either
# one `import genome` fails on its first line. `store.py` is built on that import.
gffutils = ">=0.13"
moods = ">=1.9.4,<2"
# The external tools. Nothing outside src/protein/external.py may call them.
mmseqs2 = "18.8cc5c.*"
foldseek = "10.941cd33.*"
ruff = "*"
# Exact: Pylance is pyright, so the editor and CI must give one verdict.
pyright = "==1.1.411"
python-build = "*"
# Exact: the rules in `styles/` are tuned to this version.
vale = "3.19.0.*"
markdownlint-cli2 = "*"
# For conformance, which parses mkdocs.yml and runs in `default`.
pyyaml = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
# Declared here too, not inherited: the tests run conformance, which imports it.
pyyaml = "*"

# Exact: at 0.0.x nothing promises the next patch is compatible.
[tool.pixi.feature.docs.dependencies]
zensical = "==0.0.57"
mkdocstrings-python = ">=2.0.7,<3"

# On the feature, so these resolve in `docs` with no `-e` flag. `serve` ignores `--strict`.
[tool.pixi.feature.docs.tasks]
docs = "zensical serve"
docs-build = "zensical build --clean --strict"

# Its own feature: the torch pin below would otherwise dominate every solve. PyPI-only,
# because `esm` is on no conda channel.
[tool.pixi.feature.esm.pypi-dependencies]
esm = ">=3.4,<4"

# torch from conda-forge, never PyPI: the PyPI wheel's CUDA build refuses this cluster's
# driver and loads the system libstdc++, which then breaks `import esm` too. conda-forge
# builds against the same libstdc++ as everything else here and picks its build from the
# platform variant. The bound repeats `esm`'s own `torch >=2.11,<2.12` because the conda solve
# runs first, and without it the PyPI solve has no torch left to pick.
[tool.pixi.feature.esm.dependencies]
pytorch = ">=2.11,<2.12"

# `default` takes `test` so pyright can resolve pytest, and not `docs`, which exists so that
# exactly one CI job installs it.
[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
# Not a CI job: no runner has a GPU. Its own solve group, so torch and the CUDA runtime it
# drags in stay off the environments that run the gate.
esm = { features = ["test", "esm"] }

[tool.pixi.tasks]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"
test = "pytest"
build = "python -m build"
# `.`, never an absolute path: an absolute path matches no `.vale.ini` section and exits 0.
# The globs keep the walk out of trees pytest writes to while `check.sh` runs both steps.
vale = "vale --glob='!{.pixi,site,dist,build}/**' ."
markdownlint = "markdownlint-cli2"
conformance = "python scripts/conformance.py"
# The static step list lives here and nowhere else; `check.sh` takes it as arguments.
check-static = "bash scripts/check.sh lint fmt-check typecheck vale markdownlint conformance"
check = { depends-on = ["check-static", "test"] }

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# No `target-version`: ruff infers it from `requires-python`.
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "N",   # pep8-naming
    "D",   # pydocstyle (numpy convention, configured below)
    "RUF", # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ============================== pyright ==============================

[tool.pyright]
# `scripts` and `skills` included: CI and conformance execute those files.
include = ["src", "tests", "scripts", "skills"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
# No `pythonVersion`: taken from the interpreter in the environment above.
typeCheckingMode = "standard"
# Not redundant: `standard` does not check that a parameter is annotated at all. `Any`
# satisfies it, so the fix is always in the file you are editing. Scoped off `tests/` below.
reportMissingParameterType = "error"
# Deliberately NOT `reportUnknownParameterType`: it also fails annotated parameters whose
# types an untyped dependency owns. Not a bar a lab repo can meet.
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# `tests/` back to plain `standard`: a fixture's type is pytest's, not the author's, and a test
# signature promises a caller nothing. `src` keeps it. Do not delete this block.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = "none"

# ============================== pytest ==============================

[tool.pytest.ini_options]
# `src` is collected for its docstring examples alone: `--doctest-modules` runs them, so a
# drifted example fails.
testpaths = ["tests", "src"]
# `--continue-on-collection-errors` because collecting `src` imports every module in it: a
# module needing an absent optional dependency costs one error instead of the whole run.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--continue-on-collection-errors",
    # The gate lane, and it has to live here rather than on the `test` task, because the task
    # is what CI calls. addopts is prepended, so the ESM lane is still `pytest -m model` — a
    # command-line `-m` wins over this one.
    "-m",
    "not model",
]
xfail_strict = true
markers = [
    "model: needs the ESM-C weights, so it runs by hand and never in the gate",
]
filterwarnings = [
    "error",
    # `protein.seq` warns on purpose when it folds U, O or J to X, and its examples show the
    # fold. `tests/test_seq.py` asserts the warning, so tolerating it here still tests it.
    "default::protein.seq.ResidueCoercionWarning",
]

# ============================== liulab ==============================
# Read by `scripts/conformance.py`; its docstring has the rules.

# The declared agent-facing set. Keys are path prefixes matched against `git ls-files`, not
# globs; a trailing `/` matches a directory. Values name the Vale Length rule, or `false`.
[tool.liulab.agent-docs]
"AGENTS.md" = "LengthDoc"
"CONTEXT.md" = "LengthDoc"
"docs/agents/" = "LengthDoc"
"skills/" = "LengthDoc"
"docs/adr/" = "LengthAdr"
"docs/research/" = false

# Keyed by rule name, value the reason. Per-rule, never per-file; no expiry; printed on every
# run. `placeholder-rename` refuses to be waived.
#
#     [tool.liulab.waived]
#     repo-shape = "docs-only repo; the notebooks under src/ are examples, not a package"
[tool.liulab.waived]
